<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | The Interview Mentor AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.8; }
    }
    .glow-bg {
      animation: pulse-glow 6s ease-in-out infinite;
    }
  </style>
</head>
<body class="min-h-full flex items-center justify-center bg-slate-950 p-4 relative overflow-hidden">
  <!-- Glowing Background Orbs -->
  <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none glow-bg"></div>
  <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl pointer-events-none glow-bg" style="animation-delay: 3s;"></div>

  <div class="relative w-full max-w-md bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-2xl p-8 shadow-2xl shadow-indigo-950/40">
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-600 to-purple-500 mb-4 shadow-lg shadow-indigo-500/25">
        <i class="fa-solid fa-graduation-cap text-2xl text-white"></i>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-white mb-2">The Interview Mentor</h1>
      <p class="text-sm text-slate-400">AI-Powered Interview Preparation • Gemini Engine</p>
      <div class="mt-2 inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">
        <span class="w-1.5 h-1.5 rounded-full bg-indigo-400 animate-ping"></span>
        Private Access Gate
      </div>
    </div>

    <!-- Error Alert -->
    <div id="error-alert" class="hidden mb-6 p-4 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 text-sm flex items-center gap-3">
      <i class="fa-solid fa-circle-exclamation text-base"></i>
      <span id="error-text">Authentication failed.</span>
    </div>

    <!-- Login Form -->
    <form id="login-form" class="space-y-5">
      <div>
        <label for="password" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Access Password</label>
        <div class="relative">
          <input 
            type="password" 
            id="password" 
            name="password" 
            required 
            placeholder="Enter your security password"
            autocomplete="current-password"
            class="w-full px-4 py-3 bg-slate-950/70 border border-slate-700/80 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all pr-12 text-sm"
          >
          <button 
            type="button" 
            id="toggle-pass" 
            class="absolute inset-y-0 right-0 px-4 flex items-center text-slate-400 hover:text-slate-200 transition-colors"
          >
            <i class="fa-regular fa-eye" id="toggle-icon"></i>
          </button>
        </div>
      </div>

      <button 
        type="submit" 
        id="submit-btn" 
        class="w-full py-3.5 px-4 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-medium text-sm rounded-xl shadow-lg shadow-indigo-600/25 transition-all duration-200 flex items-center justify-center gap-2 group cursor-pointer"
      >
        <span>Unlock Interview Suite</span>
        <i class="fa-solid fa-arrow-right text-xs group-hover:translate-x-1 transition-transform"></i>
      </button>
    </form>

    <!-- Footer info -->
    <div class="mt-8 pt-6 border-t border-slate-800/80 text-center text-xs text-slate-500">
      <p>Hosted on <span class="text-slate-400 font-medium">ashish-ranjan.cloud/interview</span></p>
      <p class="mt-1">Powered by Google Gemini 3.8 / Pro API</p>
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const passwordInput = document.getElementById('password');
    const toggleBtn = document.getElementById('toggle-pass');
    const toggleIcon = document.getElementById('toggle-icon');
    const errorAlert = document.getElementById('error-alert');
    const errorText = document.getElementById('error-text');
    const submitBtn = document.getElementById('submit-btn');

    // Toggle password visibility
    toggleBtn.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      toggleIcon.className = type === 'password' ? 'fa-regular fa-eye' : 'fa-regular fa-eye-slash';
    });

    // Detect base URL path (/interview or root)
    const basePath = window.location.pathname.startsWith('/interview') ? '/interview' : '';

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = passwordInput.value.trim();
      if (!password) return;

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin text-sm"></i> <span>Verifying...</span>';
      errorAlert.classList.add('hidden');

      try {
        const res = await fetch(`${basePath}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          localStorage.setItem('interview_token', data.token);
          submitBtn.innerHTML = '<i class="fa-solid fa-check text-emerald-400"></i> <span>Authorized!</span>';
          setTimeout(() => {
            window.location.href = `${basePath}/`;
          }, 400);
        } else {
          errorText.textContent = data.detail || 'Incorrect password. Please try again.';
          errorAlert.classList.remove('hidden');
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Unlock Interview Suite</span> <i class="fa-solid fa-arrow-right text-xs"></i>';
        }
      } catch (err) {
        errorText.textContent = 'Server connection error. Please try again.';
        errorAlert.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Unlock Interview Suite</span> <i class="fa-solid fa-arrow-right text-xs"></i>';
      }
    });
  </script>
</body>
</html>
